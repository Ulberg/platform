# Footprint (least memory, locally): a memory cap Go honours (GOMEMLIMIT, about 80% of the limit), so it gives memory back instead of keeping it.
server:
  retention: 1d
  resources: { limits: { memory: 512Mi } }
  env: [ { name: GOMEMLIMIT, value: 410MiB } ]
# Only the kube-state-metrics series our dashboards and alerts use.
kube-state-metrics:
  metricAllowlist:
    - kube_pod_container_resource_requests
    - kube_pod_container_resource_limits
    - kube_pod_container_status_restarts_total
    - kube_pod_container_status_last_terminated_reason
    - kube_pod_container_status_ready
    - kube_pod_status_phase
    - kube_deployment_spec_replicas
    - kube_deployment_status_replicas_available
    - kube_node_status_condition
# Node CPU, memory, filesystem and load; not the dozens of other collectors.
prometheus-node-exporter:
  extraArgs: [ --collector.disable-defaults, --collector.cpu, --collector.meminfo, --collector.filesystem, --collector.loadavg ]

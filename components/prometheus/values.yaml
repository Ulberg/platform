server:
  fullnameOverride: prometheus-server
  extraFlags:
    # The chart's own (it's replaced, not merged): lets the config reloader apply changes.
    - web.enable-lifecycle
    - web.enable-otlp-receiver
    - web.enable-remote-write-receiver
    # Exemplars: a sample request's trace ID on a metric, so a spike opens its trace (D71).
    - enable-feature=exemplar-storage
  retention: 2d
  persistentVolume: { enabled: false }
  # OTLP resource attributes Prometheus keeps as labels, so app metrics can be filtered like traces and logs.
  otlp:
    promote_resource_attributes:
      - service.name
      - service.namespace
      - service.instance.id
      - deployment.environment.name
# The chart's config reloader (v0.95) has no arm64 build yet; v0.94.0 has. Back to the chart's own when it does.
configmapReload:
  prometheus:
    image:
      tag: v0.94.0@sha256:142a1f11df8dd165f00375b0b1826aecb9c9adeb05c39855893138d7c7575ff7
alertmanager: { enabled: false }
prometheus-pushgateway: { enabled: false }
kube-state-metrics: { enabled: true }
prometheus-node-exporter: { enabled: true }
# Footprint (least memory): only the series we use. The API server's own metrics (over half of all series) and
# the kubelets' are off; cAdvisor keeps CPU, memory and restarts per container.
scrapeConfigs:
  kubernetes-api-servers: { enabled: false }
  kubernetes-nodes: { enabled: false }
  kubernetes-nodes-cadvisor:
    post_relabel_configs: ""
    metric_relabel_configs:
      - source_labels: [ __name__ ]
        action: keep
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_(receive|transmit)_bytes_total

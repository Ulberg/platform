# Footprint (least memory, locally): a memory cap Go honours (GOMEMLIMIT, about 80% of the limit), so it gives memory back instead of keeping it.
loki:
  limits_config: { retention_period: 24h, allow_structured_metadata: true }
  compactor: { retention_enabled: true, delete_request_store: filesystem }
singleBinary:
  resources: { limits: { memory: 384Mi } }
  extraEnv: [ { name: GOMEMLIMIT, value: 300MiB } ]

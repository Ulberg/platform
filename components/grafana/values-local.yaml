# Locally: http://localhost:9876 (kind maps the node port). The developer signs in as admin with a local-only
# password; Claude reads through its own Viewer service account, created by the platform CLI. Azure signs in
# with Entra (Phase 5).
service:
  type: NodePort
  nodePort: 30876
# A disk, so Claude's service account (and its token) survives a restart of Grafana; a fresh cluster gets a
# new one from the platform CLI.
persistence: { enabled: true, size: 1Gi }
# One Grafana at a time on that disk (its database is a single file): replaced, not rolled.
deploymentStrategy: { type: Recreate }
# The machine's proxy for downloading plugins, if it has one (the platform CLI's egress_proxy).
envFromConfigMaps:
  - { name: platform-proxy, optional: true }
adminUser: admin
adminPassword: local-only-admin
# So the links Grafana makes (and hands to mcp-grafana) point at its local address.
grafana.ini:
  server: { root_url: "http://localhost:9876" }

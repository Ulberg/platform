# One-time: removes the standing admin access left over from the bootstrap (PLAN.md Phase 0, D35/D36).
# Started by hand from main, in two steps; each run needs a platform lead's approval (dev environment).
# Delete this workflow once both steps are done and the standing-access check is in place.
name: remove standing access

on:
  workflow_dispatch:
    inputs:
      step:
        description: "1: the admin account's standing Global Admin only. 2: everything else."
        required: true
        type: choice
        options: ["1", "2"]

permissions:
  contents: read

concurrency:
  group: pulumi-access

jobs:
  remove:
    name: remove standing access (step ${{ inputs.step }})
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Azure sign-in (apply identity, dev environment only)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Remove standing access
        env:
          STEP: ${{ inputs.step }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: .github/scripts/remove_standing_access.sh "$STEP"

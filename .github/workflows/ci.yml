name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  prompt-log:
    name: prompt log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check .prompts/ format
        run: python3 .github/scripts/check_prompt_log.py
      - name: Test the prompt-log hook
        run: python3 .claude/hooks/test_prompt_log.py
      - name: Test the agent-identity hook (D41)
        run: python3 .claude/hooks/test_agent_identity.py
      - name: Agent-identity hook matches Ulberg/todo
        run: |
          for f in agent_identity.py test_agent_identity.py; do
            curl -sSfL "https://raw.githubusercontent.com/Ulberg/todo/main/.claude/hooks/$f" | diff -u - ".claude/hooks/$f"
          done

  dotnet:
    name: dotnet (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: F# style (no mutation, discarded results or null)
        run: .github/scripts/check_fsharp_style.sh
      - name: Style guide matches Ulberg/todo
        run: curl -sSfL https://raw.githubusercontent.com/Ulberg/todo/main/docs/fsharp-style.md | diff -u - docs/fsharp-style.md
      - name: Format (Fantomas)
        run: dotnet fantomas --check stacks tests
      - name: Build (warnings are errors)
        run: dotnet build platform.slnx -c Release
      - name: Test (includes access/people.yaml and CODEOWNERS)
        run: dotnet run --project tests/Access.Tests -c Release --no-build

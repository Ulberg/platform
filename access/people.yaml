# Everyone with access, as code. Pulumi (stacks/access) turns this into Entra groups, PIM eligibility,
# Azure role assignments, GitHub rulesets and environments, and checks every repo's CODEOWNERS.
# Object IDs are not secrets.
people:
  endre:
    github: Ulberg
    entra: 19d54064-9c11-4c17-8b66-dee39703a3e2   # admin account in the workforce tenant

groups:
  infra-developers: [endre]   # standing read on Azure/K8s/DB + infra logs; eligible for platform-write via PIM
  app-developers: [endre]     # app logs, metrics and traces only

repo-leads:                   # code owners; the platform leads are also eligible for platform-admin via PIM
  platform: [endre]
  todo: [endre]

